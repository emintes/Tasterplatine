name: Build and Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Cache STM32CubeIDE image
      id: stm32cubeide-cache
      uses: actions/cache@v4
      with:
        path: /tmp/docker-cache/stm32cubeide-11.0.tar
        key: stm32cubeide-11.0

    - name: Load STM32CubeIDE image
      run: |
        if [ -f /tmp/docker-cache/stm32cubeide-11.0.tar ]; then
          docker load -i /tmp/docker-cache/stm32cubeide-11.0.tar
        else
          mkdir -p /tmp/docker-cache
          docker pull xanderhendriks/stm32cubeide:11.0
          docker save xanderhendriks/stm32cubeide:11.0 -o /tmp/docker-cache/stm32cubeide-11.0.tar
        fi

    - name: Build STM32CubeIde project
      uses: xanderhendriks/action-build-stm32cubeide@v11.0
      with:
        project-path: '.'
        project-target: 'Testplatine'
      env:
        ENV_VERSION_MAJOR: 1
        ENV_VERSION_MINOR: 0
        ENV_VERSION_BUGFIX: 0

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-artifact
        path: Debug/Testplatine.bin

  remote-test:
    needs: build
    runs-on: [self-hosted, linux]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: build-artifact
        path: ./firmware

    - name: Run Test
      env:
        test-project-folder: "Tests"
        test-project-file: "projectCICD.etp"
      run: |
        docker pull emintes/testplattform:arm64
        docker run --rm --name test-container --device=/dev --privileged \
          -v "${{ github.workspace }}:/workspace/repo" \
          -e TEST_PROJECT_FOLDER="${{ env.test-project-folder }}" \
          -e TEST_PROJECT_FILE="${{ env.test-project-file }}" \
          -e EXTRA_COMMANDS="${{ env.extra-commands }}" \
          emintes/testplattform:arm64

    - name: Upload Testreport artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Testreport
        path: Tests/Reports/Testreport.html
